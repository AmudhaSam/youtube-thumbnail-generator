<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f9;
  --surface:#ffffff;
  --surface2:#f8f9fc;
  --surface3:#f0f2f6;
  --border:#e2e6ef;
  --border2:#c8cfe0;
  --text:#1a1d2e;
  --text2:#6b7280;
  --text3:#9ca3af;
  --accent:#4f46e5;
  --accent2:#4338ca;
  --accent-light:#eef2ff;
  --red:#ef4444;
  --green:#10b981;
  --radius:8px;
  --radius-sm:5px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 12px rgba(0,0,0,.1),0 2px 4px rgba(0,0,0,.06);
}
body{background:var(--bg);color:var(--text);font-family:'Inter','Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 64px}

/* Header */
header{text-align:center;margin-bottom:28px}
.logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:6px}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(79,70,229,.3)}
.logo-icon svg{width:20px;height:20px;fill:white}
.logo-text{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--text)}
header p{font-size:12px;color:var(--text2);letter-spacing:.02em}
.badge{display:inline-block;padding:2px 9px;background:#dcfce7;color:#166534;border-radius:999px;font-size:10px;font-weight:700;margin-left:8px;border:1px solid #bbf7d0}

/* Card */
.card{width:100%;max-width:1000px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 28px;box-shadow:var(--shadow-md)}

/* Section labels */
.flabel{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.flabel::after{content:'';flex:1;height:1px;background:var(--border)}
.mt{margin-top:14px}

/* Controls row */
.row2col{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:20px}
.ctrl-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}

/* Pills */
.sz-pill{padding:5px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:11px;cursor:pointer;transition:all .15s;font-weight:500;box-shadow:var(--shadow)}
.sz-pill:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.sz-pill.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(79,70,229,.3)}
.size-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}

/* Sliders */
.slider-row{display:flex;align-items:center;gap:10px;margin-top:9px}
.slider-row input[type=range]{flex:1;accent-color:var(--accent);cursor:pointer;height:4px}
.slider-val{font-size:11px;color:var(--text);font-weight:600;min-width:40px;text-align:right;font-family:monospace;background:var(--surface3);padding:2px 6px;border-radius:4px}

/* Background */
.bg-section{margin-bottom:20px}
.bg-options{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;align-items:center}
.bg-swatch{width:30px;height:30px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0;box-shadow:var(--shadow)}
.bg-swatch:hover{transform:scale(1.12);border-color:var(--accent)}
.bg-swatch.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.2)}
.bg-swatch.trans{background:repeating-conic-gradient(#d1d5db 0% 25%,#f3f4f6 0% 50%) 0 0/10px 10px}
.bg-grad-wrap{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;flex-shrink:0;box-shadow:var(--shadow)}
.bg-grad-wrap label{font-size:10px;color:var(--text2);white-space:nowrap;font-weight:500}
.bg-grad-wrap input[type=color]{width:24px;height:22px;border:none;border-radius:4px;cursor:pointer;padding:0}
.bg-grad-wrap select{background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--text2);font-size:10px;padding:2px 5px;cursor:pointer;outline:none}

/* Line card */
.line-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;transition:all .2s;box-shadow:var(--shadow)}
.line-card:hover{border-color:var(--border2);box-shadow:var(--shadow-md)}
.line-row1{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.line-num{font-size:11px;color:var(--accent);font-weight:700;min-width:22px;text-align:center;flex-shrink:0;background:var(--accent-light);border:1px solid rgba(79,70,229,.2);border-radius:5px;padding:2px 5px}
.line-row1 input[type=text]{flex:1;min-width:120px;padding:9px 12px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;outline:none;transition:all .2s;font-family:inherit}
.line-row1 input[type=text]:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.line-row1 select{padding:9px 7px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:11px;outline:none;cursor:pointer;max-width:150px;transition:border-color .2s}
.line-row1 select:focus{border-color:var(--accent)}
.line-size{width:62px;padding:9px 8px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px;font-weight:600;outline:none;text-align:center;transition:border-color .2s}
.line-size:focus{border-color:var(--accent)}

/* Style rows */
.line-row2,.line-row3,.line-row4{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--border);margin-top:2px}
.line-row3,.line-row4{margin-top:5px}

/* Style buttons */
.style-btn{width:28px;height:28px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface2);color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.style-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.style-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 6px rgba(79,70,229,.3)}

/* Color swatch on line */
.line-color-swatch{width:28px;height:28px;border-radius:var(--radius-sm);border:1.5px solid var(--border);cursor:pointer;flex-shrink:0;transition:all .15s;box-shadow:var(--shadow)}
.line-color-swatch:hover{transform:scale(1.1);border-color:var(--accent)}

/* FX buttons */
.fx-btn{padding:4px 10px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface2);color:var(--text2);font-size:10px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.fx-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.fx-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 6px rgba(79,70,229,.3)}

/* FX color mini swatch */
.fx-color{width:20px;height:20px;border-radius:4px;border:1.5px solid var(--border);cursor:pointer;flex-shrink:0;transition:all .15s}
.fx-color:hover{transform:scale(1.12);border-color:var(--accent)}

/* FX slider */
.fx-slider-wrap{display:flex;align-items:center;gap:3px;background:var(--surface3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px 7px}
.fx-slider-wrap input[type=range]{width:55px;accent-color:var(--accent);cursor:pointer}
.fx-slider-wrap span{font-size:9px;color:var(--text2);min-width:20px;text-align:right;font-family:monospace}

/* Row labels */
.row-label{font-size:10px;color:var(--text3);flex-shrink:0;font-weight:500}

/* Case select */
.case-select{padding:4px 6px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);font-size:10px;cursor:pointer;outline:none;transition:border-color .2s}
.case-select:focus{border-color:var(--accent)}

/* Offset slider */
.offset-slider{flex:1;max-width:100px;accent-color:var(--accent)}

/* Line actions (move/dup) */
.line-actions{display:flex;gap:4px;align-items:center;margin-left:auto;flex-shrink:0}
.mini-btn{padding:4px 8px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:11px;cursor:pointer;transition:all .15s;font-weight:600}
.mini-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}

/* Add/remove buttons */
.add-btns{display:flex;gap:8px;margin-top:8px;margin-bottom:18px}
.add-btns button{padding:8px 18px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.add-btns button:first-child{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.add-btns button:first-child:hover{background:var(--accent);color:#fff}
.add-btns button:last-child:hover{border-color:var(--red);color:var(--red);background:#fef2f2}

/* Canvas */
.canvas-outer{position:relative;margin-bottom:10px}
.canvas-wrap{width:100%;border-radius:12px;border:1.5px solid var(--border);overflow:hidden;background:repeating-conic-gradient(#e5e7eb 0% 25%,#f9fafb 0% 50%) 0 0/20px 20px;transition:transform .2s;transform-origin:top center;box-shadow:var(--shadow-md)}
canvas{display:block;width:100%;height:auto}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#9ca3af;font-size:13px;pointer-events:none}
.ph svg{width:40px;height:40px;opacity:.3}

/* Zoom */
.zoom-row{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 12px;background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border)}
.zoom-row span{font-size:11px;color:var(--text2);font-weight:500}
.zoom-row input[type=range]{flex:1;accent-color:var(--accent);cursor:pointer}
.zoom-lbl{font-size:11px;color:var(--text);font-weight:600;min-width:36px;font-family:monospace;background:var(--surface3);padding:2px 6px;border-radius:4px}
.zoom-row button{padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:10px;cursor:pointer;transition:all .15s;font-weight:500}
.zoom-row button:hover{border-color:var(--accent);color:var(--accent)}

/* Bottom bar */
.bottom-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1.5px solid var(--border)}
.dl-btn{display:flex;align-items:center;gap:6px;padding:9px 18px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.dl-btn:hover{background:var(--surface3);border-color:var(--border2)}
.dl-btn:disabled{opacity:.4;cursor:not-allowed}
.dl-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.3)}
.dl-btn.primary:hover{background:var(--accent2);box-shadow:0 6px 16px rgba(79,70,229,.4)}
.dl-btn svg{width:13px;height:13px}
.status{flex:1;text-align:right;font-size:11px;color:var(--text3)}
</style>

<body>
<header>
  <div class="logo">
    <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M23 7s-.3-2-1.2-2.8c-1.1-1.2-2.4-1.2-3-1.3C16.1 2.8 12 2.8 12 2.8s-4.1 0-6.8.1c-.6.1-1.9.1-3 1.3C1.3 5 1 7 1 7S.7 9.1.7 11.3v2c0 2.1.3 4.3.3 4.3s.3 2 1.2 2.8c1.1 1.2 2.6 1.1 3.3 1.2C7.3 21.8 12 21.8 12 21.8s4.1 0 6.8-.2c.6-.1 1.9-.1 3-1.3.9-.8 1.2-2.8 1.2-2.8s.3-2.1.3-4.3v-2C23.3 9.1 23 7 23 7zM9.7 15.5V8.4l8.1 3.6-8.1 3.5z"/></svg></div>
    <span class="logo-text">ThumbCraft</span>
    <span class="badge">100% FREE</span>
  </div>
  <p>378 fonts &nbsp;·&nbsp; per-line styling &nbsp;·&nbsp; transparent PNG &amp; JPG export</p>
</header>

<div class="card">

  <!-- BG -->
  <div class="bg-section">
    <div class="flabel">background</div>

</div>

function newLine(overrides={}) {

    text:'', fontIdx:0, fontSize:DEF_SIZE, color:'#ffffff',
    bold:false, italic:false, underline:false, strikethrough:false,

}

// ── Undo/Redo ─────────────────────────────────────────────────────────
function snapshot() {
  undoStack.push(JSON.stringify({lineData, selBg, selBgGrad, selColor, selAlign, selLineSpacing, selLetterSpacing}));
  if (undoStack.length > 40) undoStack.shift();
  redoStack = [];
}
function undoFn() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify({lineData, selBg, selBgGrad, selColor, selAlign, selLineSpacing, selLetterSpacing}));
  const s = JSON.parse(undoStack.pop());
  lineData = s.lineData; selBg = s.selBg; selBgGrad = s.selBgGrad;
  selColor = s.selColor; selAlign = s.selAlign;
  selLineSpacing = s.selLineSpacing; selLetterSpacing = s.selLetterSpacing;
  buildLineEditor(); regen();
}
function redoFn() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify({lineData, selBg, selBgGrad, selColor, selAlign, selLineSpacing, selLetterSpacing}));
  const s = JSON.parse(redoStack.pop());
  lineData = s.lineData; selBg = s.selBg; selBgGrad = s.selBgGrad;
  selColor = s.selColor; selAlign = s.selAlign;
  selLineSpacing = s.selLineSpacing; selLetterSpacing = s.selLetterSpacing;
  buildLineEditor(); regen();
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key==='z' && !e.shiftKey) { e.preventDefault(); undoFn(); }
  if ((e.ctrlKey||e.metaKey) && (e.key==='y' || (e.key==='z'&&e.shiftKey))) { e.preventDefault(); redoFn(); }
});





// ── Background ───────────────────────────────────────────────────────
function setBg(el, val) {
  selBg = val; selBgGrad = null;
  document.querySelectorAll('.bg-swatch').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  regen();
}
function setBgCustom(val) {
  selBg = val; selBgGrad = null;
  document.querySelectorAll('.bg-swatch').forEach(s=>s.classList.remove('active'));
  regen();
}
function applyGradient() {
  const c1 = document.getElementById('bgG1').value;
  const c2 = document.getElementById('bgG2').value;
  const dir = document.getElementById('bgGDir').value;
  selBgGrad = {c1, c2, dir};
  selBg = 'gradient';
  document.querySelectorAll('.bg-swatch').forEach(s=>s.classList.remove('active'));
  regen();
}

// ── Alignment ────────────────────────────────────────────────────────
document.querySelectorAll('[data-align]').forEach(p => {
  p.onclick = () => { document.querySelectorAll('[data-align]').forEach(x=>x.classList.remove('active')); p.classList.add('active'); selAlign=p.dataset.align; regen(); };
});

// ── mkColorPick helper ────────────────────────────────────────────────
function mkColorPick(initVal, onchange) {
  const wrap = document.createElement('label');
  wrap.style.cssText = 'position:relative;cursor:pointer;display:inline-flex;vertical-align:middle;';
  const swatch = document.createElement('div');
  swatch.className = 'fx-color';
  swatch.style.background = initVal || '#000000';
  const picker = document.createElement('input');
  picker.type = 'color'; picker.value = initVal || '#000000';
  picker.style.cssText = 'position:absolute;width:0;height:0;opacity:0;';
  picker.oninput = function() { swatch.style.background=this.value; onchange(this.value); };
  wrap.appendChild(swatch); wrap.appendChild(picker);
  return wrap;
}

function mkSlider(min, max, val, step, onchange, label) {
  const wrap = document.createElement('div');
  wrap.className = 'fx-slider-wrap';
  if (label) {
    const ll=document.createElement('span');
    ll.textContent=label;
    ll.style.cssText='font-size:9px;color:var(--text2);min-width:18px;text-align:center;';
    wrap.appendChild(ll);
  }
  const sl = document.createElement('input');
  sl.type='range'; sl.min=min; sl.max=max; sl.value=val; sl.step=step;
  const lbl = document.createElement('span');
  lbl.textContent = val;
  sl.oninput = function() { lbl.textContent=this.value; onchange(Number(this.value)); };
  wrap.appendChild(sl); wrap.appendChild(lbl);
  return wrap;
}

// ── Font options ─────────────────────────────────────────────────────
function buildFontOptions(selectedIdx) {
  return FONTS.map((f,i)=>`<option value="${i}"${i===selectedIdx?' selected':''}>${f.name}</option>`).join('');
}

// ── Line editor ──────────────────────────────────────────────────────
function buildLineEditor() {
  const wrap = document.getElementById('lineEditorWrap');
  wrap.innerHTML = '';
  lineData.forEach((ld, i) => {
    const card = document.createElement('div');
    card.className = 'line-card';

    // Row 1: label + text + font + size + move + duplicate
    const row1 = document.createElement('div');
    row1.className = 'line-row1';

    const lbl = document.createElement('span');
    lbl.className = 'line-num'; lbl.textContent = 'L'+(i+1);

    const textInput = document.createElement('input');
    textInput.type='text'; textInput.placeholder='Line '+(i+1)+'…'; textInput.value=ld.text;
    textInput.oninput = (function(idx){ return function(){ lineData[idx].text=this.value; regen(); }; })(i);
    textInput.onblur = (function(idx){ return function(){ snapshot(); }; })(i);

    const fontSel = document.createElement('select');
    fontSel.innerHTML = buildFontOptions(ld.fontIdx);
    fontSel.onchange = (function(idx){ return function(){ snapshot(); lineData[idx].fontIdx=parseInt(this.value); regen(); }; })(i);

    const sizeInput = document.createElement('input');
    sizeInput.type='number'; sizeInput.className='line-size';
    sizeInput.min=10; sizeInput.max=400; sizeInput.value=ld.fontSize||DEF_SIZE;
    sizeInput.title='Font size in px';
    sizeInput.oninput = (function(idx){ return function(){ snapshot(); lineData[idx].fontSize=parseInt(this.value)||DEF_SIZE; regen(); }; })(i);

    // Move up/down + duplicate
    const actions = document.createElement('div');
    actions.className = 'line-actions';
    if (i>0) {
      const up = document.createElement('button'); up.className='mini-btn'; up.title='Move up'; up.textContent='↑';
      up.onclick = (function(idx){ return function(){ snapshot(); const t=lineData[idx]; lineData[idx]=lineData[idx-1]; lineData[idx-1]=t; buildLineEditor(); regen(); }; })(i);
      actions.appendChild(up);
    }
    if (i<lineData.length-1) {
      const dn = document.createElement('button'); dn.className='mini-btn'; dn.title='Move down'; dn.textContent='↓';
      dn.onclick = (function(idx){ return function(){ snapshot(); const t=lineData[idx]; lineData[idx]=lineData[idx+1]; lineData[idx+1]=t; buildLineEditor(); regen(); }; })(i);
      actions.appendChild(dn);
    }
    const dup = document.createElement('button'); dup.className='mini-btn'; dup.title='Duplicate'; dup.textContent='⧉';
    dup.onclick = (function(idx){ return function(){ snapshot(); if(lineData.length>=8)return; lineData.splice(idx+1,0,JSON.parse(JSON.stringify(lineData[idx]))); buildLineEditor(); regen(); }; })(i);
    actions.appendChild(dup);

    row1.appendChild(lbl); row1.appendChild(textInput); row1.appendChild(fontSel); row1.appendChild(sizeInput); row1.appendChild(actions);

    // Row 2: color + B I U S + case + vertical offset
    const row2 = document.createElement('div');
    row2.className = 'line-row2';

    const colorWrap = document.createElement('label');
    colorWrap.style.cssText='position:relative;cursor:pointer;';
    const colorSwatch = document.createElement('div');
    colorSwatch.className='line-color-swatch'; colorSwatch.style.background=ld.color||'#ffffff';
    if (!ld.color||ld.color==='#ffffff') colorSwatch.style.boxShadow='inset 0 0 0 1px #444';
    const colorPicker = document.createElement('input');
    colorPicker.type='color'; colorPicker.value=ld.color||'#ffffff';
    colorPicker.style.cssText='position:absolute;width:0;height:0;opacity:0;';
    colorPicker.oninput=(function(idx,sw){return function(){ snapshot(); lineData[idx].color=this.value; sw.style.background=this.value; sw.style.boxShadow='none'; regen(); };})(i,colorSwatch);
    colorWrap.appendChild(colorSwatch); colorWrap.appendChild(colorPicker);

    function mkStyleBtn(html, title, prop, idx) {
      const b=document.createElement('button');
      b.className='style-btn'+(lineData[idx][prop]?' on':''); b.title=title; b.innerHTML=html;
      b.onclick=(function(ii,btn,p){return function(){snapshot();lineData[ii][p]=!lineData[ii][p];btn.classList.toggle('on');regen();};})(idx,b,prop);
      return b;
    }

    const caseSelect = document.createElement('select');
    caseSelect.className = 'case-select';
    caseSelect.title = 'Text transform';
    ['none','UPPER','lower','Title'].forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v||'Aa'; if(ld.caseMode===v)o.selected=true; caseSelect.appendChild(o); });
    caseSelect.onchange=(function(idx){return function(){ snapshot(); lineData[idx].caseMode=this.value; regen(); };})(i);

    row2.appendChild(colorWrap);
    row2.appendChild(mkStyleBtn('<b>B</b>','Bold','bold',i));
    row2.appendChild(mkStyleBtn('<i>I</i>','Italic','italic',i));
    row2.appendChild(mkStyleBtn('<u>U</u>','Underline','underline',i));
    row2.appendChild(mkStyleBtn('<s>S</s>','Strikethrough','strikethrough',i));
    row2.appendChild(document.createTextNode(' '));
    const lbl2=document.createElement('span'); lbl2.className='row-label'; lbl2.textContent='case:'; row2.appendChild(lbl2);
    row2.appendChild(caseSelect);

    // Vertical offset
    const offLbl=document.createElement('span'); offLbl.className='row-label'; offLbl.style.marginLeft='6px'; offLbl.textContent='↕:'; row2.appendChild(offLbl);
    const offSlider=document.createElement('input'); offSlider.type='range'; offSlider.className='offset-slider';
    offSlider.min=-300; offSlider.max=300; offSlider.step=1; offSlider.value=ld.offsetY||0;
    offSlider.title='Vertical position offset';
    offSlider.oninput=(function(idx,sl){return function(){ lineData[idx].offsetY=parseInt(this.value); regen(); };})(i,offSlider);
    const offReset=document.createElement('button'); offReset.className='mini-btn'; offReset.title='Reset position'; offReset.textContent='↺';
    offReset.onclick=(function(idx,sl){return function(){ lineData[idx].offsetY=0; sl.value=0; regen(); };})(i,offSlider);
    row2.appendChild(offSlider); row2.appendChild(offReset);

    // Row 3: FX buttons
    const row3 = document.createElement('div');
    row3.className = 'line-row3';
    const fxLbl=document.createElement('span'); fxLbl.className='row-label'; fxLbl.textContent='fx:'; row3.appendChild(fxLbl);

    // Outline
    const btnOL=document.createElement('button'); btnOL.className='fx-btn'+(ld.outline?' on':''); btnOL.textContent='◻ Outline';
    btnOL.onclick=(function(idx,btn){return function(){snapshot();lineData[idx].outline=!lineData[idx].outline;btn.classList.toggle('on');regen();};})(i,btnOL);
    const olPick=mkColorPick(ld.outColor||'#000000',(function(idx){return function(v){lineData[idx].outColor=v;regen();};})(i));
    const olW=mkSlider(1,20,ld.outW||3,1,(function(idx){return function(v){lineData[idx].outW=v;regen();};})(i));
    row3.appendChild(btnOL); row3.appendChild(olPick); row3.appendChild(olW);

    // Stroke
    const btnST=document.createElement('button'); btnST.className='fx-btn'+(ld.stroke?' on':''); btnST.textContent='✏ Stroke';
    btnST.onclick=(function(idx,btn){return function(){snapshot();lineData[idx].stroke=!lineData[idx].stroke;btn.classList.toggle('on');regen();};})(i,btnST);
    const stPick=mkColorPick(ld.strokeColor||'#000000',(function(idx){return function(v){lineData[idx].strokeColor=v;regen();};})(i));
    const stW=mkSlider(1,20,ld.strokeW||3,1,(function(idx){return function(v){lineData[idx].strokeW=v;regen();};})(i));
    row3.appendChild(btnST); row3.appendChild(stPick); row3.appendChild(stW);

    // 3D
    const btn3D=document.createElement('button'); btn3D.className='fx-btn'+(ld.shadow3d?' on':''); btn3D.textContent='🎲 3D';
    btn3D.onclick=(function(idx,btn){return function(){snapshot();lineData[idx].shadow3d=!lineData[idx].shadow3d;btn.classList.toggle('on');regen();};})(i,btn3D);
    row3.appendChild(btn3D);

    // Glow
    const btnGW=document.createElement('button'); btnGW.className='fx-btn'+(ld.glow?' on':''); btnGW.textContent='✨ Glow';
    btnGW.onclick=(function(idx,btn){return function(){snapshot();lineData[idx].glow=!lineData[idx].glow;btn.classList.toggle('on');regen();};})(i,btnGW);
    const gwPick=mkColorPick(ld.glowColor||ld.color||'#ffffff',(function(idx){return function(v){lineData[idx].glowColor=v;regen();};})(i));
    row3.appendChild(btnGW); row3.appendChild(gwPick);

    // Row 4: Text Shadow
    const row4 = document.createElement('div');
    row4.className = 'line-row4';
    const tshLbl=document.createElement('span'); tshLbl.className='row-label'; tshLbl.textContent='shadow:'; row4.appendChild(tshLbl);
    const btnTS=document.createElement('button'); btnTS.className='fx-btn'+(ld.textShadow?' on':''); btnTS.textContent='🌑 Shadow';
    btnTS.onclick=(function(idx,btn){return function(){snapshot();lineData[idx].textShadow=!lineData[idx].textShadow;btn.classList.toggle('on');regen();};})(i,btnTS);
    const tshPick=mkColorPick(ld.tshColor||'#000000',(function(idx){return function(v){lineData[idx].tshColor=v;regen();};})(i));
    const tshX=mkSlider(-80,80,ld.tshX||4,1,(function(idx){return function(v){lineData[idx].tshX=v;regen();};})(i),'X');
    const tshY=mkSlider(-80,80,ld.tshY||4,1,(function(idx){return function(v){lineData[idx].tshY=v;regen();};})(i),'Y');
    const tshB=mkSlider(0,60,ld.tshBlur||8,1,(function(idx){return function(v){lineData[idx].tshBlur=v;regen();};})(i),'blur');
    row4.appendChild(btnTS); row4.appendChild(tshPick); row4.appendChild(tshX); row4.appendChild(tshY); row4.appendChild(tshB);

    card.appendChild(row1); card.appendChild(row2); card.appendChild(row3); card.appendChild(row4);
    wrap.appendChild(card);
  });
}

function addLine() {
  if (lineData.length>=8) return;
  snapshot();
  lineData.push(newLine({color:selColor}));
  buildLineEditor(); regen();
}
function removeLine() {
  if (lineData.length<=1) return;
  snapshot();
  lineData.pop();
  buildLineEditor(); regen();
}

// ── Regen ─────────────────────────────────────────────────────────────
let regenTimer = null;
function regen() {
  if (!lineData.some(l=>l.text.trim())) return;
  clearTimeout(regenTimer);
  regenTimer = setTimeout(drawThumbnail, 16);
}

// ── Apply case transform ──────────────────────────────────────────────
function applyCase(text, mode) {
  if (mode==='UPPER') return text.toUpperCase();
  if (mode==='lower') return text.toLowerCase();
  if (mode==='Title') return text.replace(/\b\w/g, c=>c.toUpperCase());
  return text;
}

// ── Draw ──────────────────────────────────────────────────────────────
function drawThumbnail() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W=1280, H=720;
  canvas.width=W; canvas.height=H;
  ctx.clearRect(0,0,W,H);

  // Background
  if (selBg==='gradient' && selBgGrad) {
    const dir = selBgGrad.dir;
    let x0=0,y0=0,x1=0,y1=0;
    if(dir==='to right'){x0=0;y0=0;x1=W;y1=0;}
    else if(dir==='to bottom'){x0=0;y0=0;x1=0;y1=H;}
    else if(dir==='to bottom right'){x0=0;y0=0;x1=W;y1=H;}
    else if(dir==='to top right'){x0=0;y0=H;x1=W;y1=0;}
    else if(dir==='to bottom left'){x0=W;y0=0;x1=0;y1=H;}
    const grd = ctx.createLinearGradient(x0,y0,x1,y1);
    grd.addColorStop(0, selBgGrad.c1);
    grd.addColorStop(1, selBgGrad.c2);
    ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
  } else if (selBg && selBg!=='transparent') {
    ctx.fillStyle=selBg; ctx.fillRect(0,0,W,H);
  }

  // Calculate line positions
  const visibleLines = lineData.filter(l=>l.text.trim());
  if (!visibleLines.length) return;

  const lineHeights = lineData.map(ld=>(ld.fontSize||DEF_SIZE)*selLineSpacing);
  const totalH = lineHeights.reduce((a,b)=>a+b,0);
  let cx = selAlign==='left' ? 80 : selAlign==='right' ? W-80 : W/2;

  const lineYs = [];
  let curY = H/2 - totalH/2;
  lineData.forEach(ld => {
    const fs = ld.fontSize||DEF_SIZE;
    lineYs.push(curY + fs*0.85);
    curY += fs*selLineSpacing;
  });

  lineData.forEach((ld, i) => {
    if (!ld.text.trim()) return;
    const fs = ld.fontSize||DEF_SIZE;
    const line = applyCase(ld.text, ld.caseMode||'none');
    const fontFamily = FONTS[ld.fontIdx] ? FONTS[ld.fontIdx].f : FONTS[0].f;
    const weight = ld.bold ? 'bold' : 'normal';
    const fstyle = ld.italic ? 'italic' : 'normal';
    const fontStr = fstyle+' '+weight+' '+fs+'px '+fontFamily;
    const lineColor = ld.color||'#ffffff';
    const y = lineYs[i] + (ld.offsetY||0);

    ctx.font = fontStr;
    const charWidths = line.split('').map(ch=>ctx.measureText(ch).width);
    const tw = selLetterSpacing!==0
      ? charWidths.reduce((a,b)=>a+b,0)+selLetterSpacing*Math.max(0,line.length-1)
      : ctx.measureText(line).width;
    const tx = selAlign==='center' ? cx-tw/2 : selAlign==='right' ? cx-tw : cx;

    function drawText(mode) {
      ctx.font = fontStr;
      ctx.textAlign = 'left';
      if (selLetterSpacing !== 0) {
        let x = tx;
        line.split('').forEach((ch, ci) => {
          if (mode==='fill') ctx.fillText(ch, x, y);
          else ctx.strokeText(ch, x, y);
          x += charWidths[ci] + selLetterSpacing;
        });
      } else {
        if (mode==='fill') ctx.fillText(line, tx, y);
        else ctx.strokeText(line, tx, y);
      }
    }

    ctx.save();

    // 3D
    if (ld.shadow3d) {
      ctx.shadowBlur=0; ctx.shadowOffsetX=0; ctx.shadowOffsetY=0;
      const depth=Math.max(4,Math.round(fs*0.055));
      for(let d=depth;d>=1;d--){
        const shade=Math.max(20,100-d*12);
        ctx.fillStyle='rgb('+shade+','+shade+','+shade+')';
        ctx.save(); ctx.translate(d,d); drawText('fill'); ctx.restore();
      }
    }

    // Text shadow
    if (ld.textShadow) {
      ctx.save();
      ctx.shadowColor=ld.tshColor||'#000000';
      ctx.shadowBlur=ld.tshBlur||8;
      ctx.shadowOffsetX=ld.tshX||4; ctx.shadowOffsetY=ld.tshY||4;
      ctx.fillStyle=lineColor; drawText('fill');
      ctx.restore();
    }

    // Glow
    if (ld.glow) {
      const glowCol=(ld.glowColor&&ld.glowColor!=='') ? ld.glowColor : lineColor;
      ctx.shadowColor=glowCol; ctx.shadowBlur=fs*0.45;
      ctx.shadowOffsetX=0; ctx.shadowOffsetY=0;
      ctx.fillStyle=lineColor; drawText('fill');
      ctx.shadowBlur=fs*0.22; drawText('fill');
      ctx.shadowBlur=0;
    }

    // Stroke
    if (ld.stroke) {
      ctx.shadowBlur=0; ctx.shadowOffsetX=0; ctx.shadowOffsetY=0;
      ctx.strokeStyle=ld.strokeColor||'#000000';
      ctx.lineWidth=ld.strokeW||3; ctx.lineJoin='round'; drawText('stroke');
    }

    // Outline
    if (ld.outline) {
      ctx.shadowBlur=0; ctx.shadowOffsetX=0; ctx.shadowOffsetY=0;
      ctx.strokeStyle=ld.outColor||'#000000';
      ctx.lineWidth=ld.outW||3; ctx.lineJoin='round'; drawText('stroke');
    }

    // Main fill
    if (!ld.outline) {
      if (!ld.glow && !ld.textShadow) {
        ctx.shadowColor='rgba(0,0,0,0.8)'; ctx.shadowBlur=10; ctx.shadowOffsetX=2; ctx.shadowOffsetY=2;
      } else { ctx.shadowBlur=0; ctx.shadowOffsetX=0; ctx.shadowOffsetY=0; }
      ctx.fillStyle=lineColor; drawText('fill');
      ctx.shadowBlur=0; ctx.shadowOffsetX=0; ctx.shadowOffsetY=0;
    }

    // Bold extra pass
    if (ld.bold && !ld.stroke && !ld.outline) {
      ctx.strokeStyle=lineColor; ctx.lineWidth=Math.max(1,fs*0.02); ctx.lineJoin='round';
      ctx.shadowBlur=0; drawText('stroke');
    }

    // Underline
    if (ld.underline) {
      ctx.shadowBlur=0; ctx.fillStyle=lineColor;
      ctx.fillRect(tx, y+fs*0.1, tw, Math.max(2,fs*0.05));
    }

    // Strikethrough
    if (ld.strikethrough) {
      ctx.shadowBlur=0; ctx.fillStyle=lineColor;
      ctx.fillRect(tx, y-fs*0.3, tw, Math.max(2,fs*0.05));
    }

    ctx.restore();
  });

  // Watermark
  ctx.shadowBlur=0; ctx.shadowOffsetX=0; ctx.shadowOffsetY=0;
  ctx.font='bold 16px sans-serif'; ctx.textAlign='right';
  ctx.fillStyle='rgba(255,255,255,0.06)';
  ctx.fillText('ThumbCraft', W-22, H-16);

  document.getElementById('ph').style.display='none';
  document.getElementById('dlBtn').disabled=false;
  document.getElementById('dlJpgBtn').disabled=false;
  document.getElementById('cpyBtn').disabled=false;
  document.getElementById('status').textContent='✓ 1280×720 · '+lineData.filter(l=>l.text.trim()).length+' line(s) · Ctrl+Z to undo';
}

// ── Zoom ──────────────────────────────────────────────────────────────
function setZoom(val) {
  const v = parseInt(val);
  document.getElementById('zoomLbl').textContent=v+'%';
  const wrap = document.getElementById('canvasWrap');
  wrap.style.transform = 'scale('+v/100+')';
  wrap.style.transformOrigin = 'top center';
  wrap.style.marginBottom = v > 100 ? ((v-100)*2)+'px' : '0';
}

// ── Download/Copy ─────────────────────────────────────────────────────
function getExportCanvas(forJpg) {
  const c=document.getElementById('c');
  const off=document.createElement('canvas');
  off.width=1280; off.height=720;
  const ox=off.getContext('2d');
  if(forJpg){ ox.fillStyle='#000000'; ox.fillRect(0,0,1280,720); }
  ox.drawImage(c,0,0,1280,720);
  return off;
}
function downloadJPG() {
  const a=document.createElement('a');
  const slug=lineData.map(l=>l.text).join(' ').trim().replace(/[\s]+/g,'-').toLowerCase().slice(0,30)||'thumbnail';
  a.download='thumbnail-'+slug+'.jpg'; a.href=getExportCanvas().toDataURL('image/jpeg',0.92); a.click();
}
async function copyCanvas() {
  try {
    getExportCanvas().toBlob(async blob=>{
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      const b=document.getElementById('cpyBtn');
      b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
      setTimeout(()=>{b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy';},2000);
    });
  } catch(e){alert('Copy not supported — use Download.');}
}

// ── Init ──────────────────────────────────────────────────────────────
buildLineEditor();
