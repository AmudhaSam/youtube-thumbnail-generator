<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d0d;--surface:#161616;--surface2:#1f1f1f;--border:#2a2a2a;--text:#f0f0f0;--text2:#888;--red:#e63946;--red2:#b52b36;--radius:10px}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 12px 80px}
header{text-align:center;margin-bottom:24px}
.logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:4px}
.logo-icon{width:34px;height:34px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:18px;height:18px;fill:white}
.logo-text{font-size:22px;font-weight:900;letter-spacing:1px}
header p{font-size:11px;color:var(--text2);letter-spacing:.04em}
.badge{display:inline-block;padding:2px 8px;background:#1a3a1a;color:#4caf50;border-radius:999px;font-size:10px;font-weight:700;margin-left:6px}
.card{width:100%;max-width:960px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}
.flabel{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:8px}

/* Search */
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap input{width:100%;padding:9px 14px 9px 36px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--red)}
.search-wrap input::placeholder{color:#444}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text2);fill:none}
.font-count-badge{font-size:11px;color:var(--text2);margin-bottom:8px}

/* Font grid */
.font-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;max-height:400px;overflow-y:auto;padding-right:4px;margin-bottom:20px}
.font-grid::-webkit-scrollbar{width:4px}
.font-grid::-webkit-scrollbar-track{background:var(--surface2)}
.font-grid::-webkit-scrollbar-thumb{background:#444;border-radius:4px}
.font-card{background:var(--surface2);border:1.5px solid var(--border);border-radius:9px;overflow:hidden;cursor:pointer;transition:border-color .12s,transform .1s}
.font-card:hover{border-color:#555;transform:translateY(-1px)}
.font-card.active{border:2px solid var(--red);background:#1f1010}
.font-preview{height:68px;background:#000;display:flex;align-items:center;justify-content:center;padding:6px}
.font-preview span{color:#fff;font-size:24px;line-height:1.1;text-align:center;max-width:100%;overflow:hidden;white-space:nowrap}
.font-card.active .font-preview span{color:var(--red)}
.font-meta{padding:5px 9px;display:flex;flex-direction:column;gap:1px}
.font-name{font-size:10px;color:var(--text);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.font-vibe{font-size:9px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.no-results{color:var(--text2);font-size:13px;padding:20px;text-align:center;grid-column:1/-1}

/* Controls */
.controls-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.ctrl-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.color-swatches{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.swatch{width:26px;height:26px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:border-color .12s,transform .1s}
.swatch:hover{transform:scale(1.12)}
.swatch.active{border-color:#fff}
.custom-color{display:flex;align-items:center;gap:6px;margin-top:8px}
.custom-color input[type=color]{width:30px;height:26px;border:none;border-radius:6px;cursor:pointer;background:none;padding:0}
.custom-color span{font-size:11px;color:var(--text2)}
.size-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sz-pill{padding:4px 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:11px;cursor:pointer;transition:all .12s}
.sz-pill:hover{border-color:#555;color:var(--text)}
.sz-pill.active{background:var(--red);color:#fff;border-color:var(--red)}

/* BG */
.bg-row{margin-bottom:18px}
.bg-swatches{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.bg-swatch{width:32px;height:32px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:border-color .12s,transform .1s}
.bg-swatch:hover{transform:scale(1.1)}
.bg-swatch.active{border-color:#fff}

/* Input */
.input-row{display:flex;gap:8px;margin-bottom:16px}
.input-row input{flex:1;padding:11px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.input-row input:focus{border-color:var(--red)}
.input-row input::placeholder{color:#444}
.gen-btn{padding:11px 22px;background:var(--red);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s,transform .1s}
.gen-btn:hover{background:var(--red2)}
.gen-btn:active{transform:scale(.97)}

/* Canvas */
.canvas-wrap{width:100%;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--border);overflow:hidden;position:relative;margin-bottom:14px;background:#000}
canvas{width:100%!important;height:100%!important;display:block}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#333;font-size:12px;pointer-events:none}
.ph svg{width:40px;height:40px;opacity:.2}

/* Bottom */
.bottom-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dl-btn{display:flex;align-items:center;gap:5px;padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;transition:background .15s}
.dl-btn:hover{background:#2a2a2a}
.dl-btn:disabled{opacity:.3;cursor:not-allowed}
.dl-btn svg{width:13px;height:13px}
.status{flex:1;text-align:right;font-size:11px;color:var(--text2)}
</style>
</head>

</header>

<div class="card">

  <div class="flabel">choose font &nbsp;<span class="font-count-badge" id="fontCountLabel"></span></div>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="fontSearch" placeholder="Search fonts… e.g. bold, retro, horror, script" oninput="filterFonts()" />
  </div>
  <div class="font-grid" id="fontGrid"></div>

  <div class="bg-row">
    <div class="flabel">background</div>
    <div class="bg-swatches" id="bgSwatches"></div>
  </div>

  <div class="controls-row">
    <div class="ctrl-box">
      <div class="flabel">text color</div>
      <div class="color-swatches" id="colorSwatches"></div>
      <div class="custom-color">
        <input type="color" id="customColor" value="#ffffff" oninput="setCustomColor(this.value)" />
        <span>custom color</span>
      </div>
    </div>
    <div class="ctrl-box">
      <div class="flabel">font size</div>
      <div class="size-row" id="sizeRow">
        <div class="sz-pill" data-size="70">XS</div>
        <div class="sz-pill" data-size="95">Small</div>
        <div class="sz-pill active" data-size="130">Medium</div>
        <div class="sz-pill" data-size="165">Large</div>
        <div class="sz-pill" data-size="200">XL</div>
        <div class="sz-pill" data-size="240">XXL</div>
      </div>
      <div class="flabel" style="margin-top:13px">alignment</div>
      <div class="size-row" id="alignRow">
        <div class="sz-pill active" data-align="center">Center</div>
        <div class="sz-pill" data-align="left">Left</div>
        <div class="sz-pill" data-align="right">Right</div>
      </div>
    </div>
  </div>

  <div class="flabel">video title</div>
  <div class="input-row">
    <input id="titleInput" type="text" placeholder="e.g.  10 Life Hacks That Changed Everything" maxlength="90" />
    <button class="gen-btn" onclick="generate()">Generate</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="c" width="1280" height="720"></canvas>
    <div class="ph" id="ph">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      Pick a font, enter a title, hit Generate
    </div>
  </div>

  <div class="bottom-row">
    <button class="dl-btn" id="dlBtn" disabled onclick="downloadPNG()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download PNG
    </button>
    <button class="dl-btn" id="cpyBtn" disabled onclick="copyCanvas()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      Copy Image
    </button>
    <span class="status" id="status">1280 × 720 px</span>
  </div>
</div>

let selFont = 0, selColor = '#ffffff', selBg = 0, selSize = 130, selAlign = 'center';
let filteredFonts = [...FONTS];

function buildGrid() {
  const g = document.getElementById('fontGrid');
  g.innerHTML = '';
  document.getElementById('fontCountLabel').textContent = filteredFonts.length + ' / ' + FONTS.length + ' fonts';
  if (!filteredFonts.length) {
    g.innerHTML = '<div class="no-results">No fonts match your search</div>';
    return;
  }
  filteredFonts.forEach((f, i) => {
    const realIdx = FONTS.indexOf(f);
    const card = document.createElement('div');
    card.className = 'font-card' + (realIdx === selFont ? ' active' : '');
    card.innerHTML = '<div class="font-preview"><span style="font-family:' + f.f + '">' + f.preview + '</span></div><div class="font-meta"><div class="font-name">' + f.name + '</div><div class="font-vibe">' + f.vibe + '</div></div>';
    card.onclick = () => { selFont = realIdx; buildGrid(); regen(); };
    g.appendChild(card);
  });
}

function filterFonts() {
  const q = document.getElementById('fontSearch').value.toLowerCase().trim();
  filteredFonts = q ? FONTS.filter(f => f.name.toLowerCase().includes(q) || f.vibe.toLowerCase().includes(q)) : [...FONTS];
  buildGrid();
}

function buildColors() {
  const s = document.getElementById('colorSwatches');
  s.innerHTML = '';
  TEXT_COLORS.forEach(({c}) => {
    const d = document.createElement('div');
    d.className = 'swatch' + (selColor === c ? ' active' : '');
    d.style.background = c;
    if (c === '#ffffff' || c === '#f5f5f5') d.style.boxShadow = 'inset 0 0 0 1px #444';
    d.onclick = () => { selColor = c; document.getElementById('customColor').value = c; buildColors(); regen(); };
    s.appendChild(d);
  });
}

function setCustomColor(v) { selColor = v; buildColors(); regen(); }

function buildBg() {
  const s = document.getElementById('bgSwatches');
  s.innerHTML = '';
  BG_OPTIONS.forEach((b, i) => {
    const d = document.createElement('div');
    d.className = 'bg-swatch' + (selBg === i ? ' active' : '');
    d.style.background = b.grad ? 'linear-gradient(135deg,' + b.grad[0] + ',' + b.grad[1] + ')' : b.c1;
    if (b.c1 === '#ffffff' || b.c1 === '#f5f0e8' || b.c1 === '#e8e8e8') d.style.boxShadow = 'inset 0 0 0 1px #555';
    d.title = b.label;
    d.onclick = () => { selBg = i; buildBg(); regen(); };
    s.appendChild(d);
  });
}

});

function regen() { const t = document.getElementById('titleInput').value.trim(); if (t) drawThumbnail(t); }
function generate() { const t = document.getElementById('titleInput').value.trim(); if (!t) { document.getElementById('titleInput').focus(); return; } drawThumbnail(t); }

function splitTitle(title) {
  const words = title.split(' ');
  if (words.length <= 2) return [title.toUpperCase()];
  const mid = Math.ceil(words.length / 2);
  return [words.slice(0, mid).join(' ').toUpperCase(), words.slice(mid).join(' ').toUpperCase()];
}

function drawThumbnail(title) {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = 1280, H = 720;
  canvas.width = W; canvas.height = H;
  const bg = BG_OPTIONS[selBg];
  if (bg.grad) {
    const grd = ctx.createLinearGradient(0, 0, W, H);
    grd.addColorStop(0, bg.grad[0]); grd.addColorStop(1, bg.grad[1]);
    ctx.fillStyle = grd;
  } else { ctx.fillStyle = bg.c1; }
  ctx.fillRect(0, 0, W, H);

  const fontFamily = FONTS[selFont].f;
  const lines = splitTitle(title);
  let fs = selSize;
  const maxLen = Math.max(...lines.map(l => l.length));
  if (maxLen > 28) fs = Math.min(fs, 85);
  else if (maxLen > 22) fs = Math.min(fs, 105);
  else if (maxLen > 16) fs = Math.min(fs, 130);

  ctx.font = fs + 'px ' + fontFamily;
  ctx.textAlign = selAlign;
  ctx.fillStyle = selColor;
  const isDark = selColor === '#000000' || selColor === '#1a1a1a';
  ctx.shadowColor = isDark ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.85)';
  ctx.shadowBlur = 18; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 3;
  const lineH = fs * 1.12, totalH = lines.length * lineH;
  let cx = W / 2;
  if (selAlign === 'left') cx = 80;
  else if (selAlign === 'right') cx = W - 80;
  const startY = H / 2 - totalH / 2 + fs * 0.85;
  lines.forEach((line, i) => ctx.fillText(line, cx, startY + i * lineH));
  ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
  ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillText('ThumbCraft', W - 22, H - 16);
  document.getElementById('ph').style.display = 'none';
  document.getElementById('dlBtn').disabled = false;
  document.getElementById('cpyBtn').disabled = false;
  document.getElementById('status').textContent = '✓ Ready · 1280×720 · ' + FONTS[selFont].name;
}

function downloadPNG() {
  const c = document.getElementById('c');
  const slug = document.getElementById('titleInput').value.trim().replace(/\s+/g, '-').toLowerCase().slice(0, 30) || 'thumbnail';
  const a = document.createElement('a'); a.download = 'thumbnail-' + slug + '.png'; a.href = c.toDataURL('image/png'); a.click();
}

async function copyCanvas() {
  try {
    document.getElementById('c').toBlob(async blob => {
      await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
      const b = document.getElementById('cpyBtn');
      b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
      setTimeout(() => { b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy Image'; }, 2000);
    });
  } catch(e) { alert('Copy not supported — use Download instead.'); }
}
