<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:transparent;--surface:rgba(22,22,22,0.85);--surface2:rgba(31,31,31,0.85);--border:#2a2a2a;--text:#f0f0f0;--text2:#888;--red:#e63946;--red2:#b52b36;--radius:10px}
body{background:transparent;color:var(--text);font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 12px 80px}
header{text-align:center;margin-bottom:24px}
.logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:4px}
.logo-icon{width:34px;height:34px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:18px;height:18px;fill:white}
.logo-text{font-size:22px;font-weight:900;letter-spacing:1px}
header p{font-size:11px;color:var(--text2);letter-spacing:.04em}
.badge{display:inline-block;padding:2px 8px;background:#1a3a1a;color:#4caf50;border-radius:999px;font-size:10px;font-weight:700;margin-left:6px}
.card{width:100%;max-width:960px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}
.flabel{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:8px}



/* Controls */
.controls-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.ctrl-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.color-swatches{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.swatch{width:26px;height:26px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:border-color .12s,transform .1s}
.swatch:hover{transform:scale(1.12)}
.swatch.active{border-color:#fff}
.custom-color{display:flex;align-items:center;gap:6px;margin-top:8px}
.custom-color input[type=color]{width:30px;height:26px;border:none;border-radius:6px;cursor:pointer;background:none;padding:0}
.custom-color span{font-size:11px;color:var(--text2)}
.size-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sz-pill{padding:4px 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:11px;cursor:pointer;transition:all .12s}
.sz-pill:hover{border-color:#555;color:var(--text)}
.sz-pill.active{background:var(--red);color:#fff;border-color:var(--red)}
.slider-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.slider-row input[type=range]{flex:1;accent-color:var(--red);cursor:pointer}
.slider-val{font-size:11px;color:var(--text);font-weight:700;min-width:36px;text-align:right;font-family:monospace}

/* BG */

.bg-swatches{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.bg-swatch{width:32px;height:32px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:border-color .12s,transform .1s}
.bg-swatch:hover{transform:scale(1.1)}
.bg-swatch.active{border-color:#fff}

/* Input */
.input-row{display:flex;gap:8px;margin-bottom:16px}
.input-row input{flex:1;padding:11px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.input-row input:focus{border-color:var(--red)}
.line-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.line-row input{flex:1;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;outline:none;transition:border-color .2s;}
.line-row input:focus{border-color:var(--red);}
.line-row select{padding:9px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:11px;outline:none;cursor:pointer;max-width:160px;transition:border-color .2s;}
.line-row select:focus{border-color:var(--red);}
.line-num{font-size:11px;color:var(--text2);font-weight:700;min-width:18px;text-align:center;}
.line-size{width:64px;padding:9px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px;font-weight:700;outline:none;text-align:center;transition:border-color .2s;}
.line-size:focus{border-color:var(--red);}
.line-style-row{display:flex;gap:5px;align-items:center;margin-top:5px;padding:4px 0;}
.style-btn{width:28px;height:28px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0;}
.style-btn:hover{border-color:#555;color:var(--text);}
.style-btn.on{background:var(--red);color:#fff;border-color:var(--red);}
.line-color-swatch{width:28px;height:28px;border-radius:5px;border:1px solid var(--border);cursor:pointer;flex-shrink:0;}
.fx-row{display:flex;gap:5px;align-items:center;margin-top:5px;flex-wrap:wrap;}
.fx-btn{padding:3px 9px;border-radius:4px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:10px;font-weight:700;cursor:pointer;transition:all .12s;white-space:nowrap;}
.fx-btn:hover{border-color:#555;color:var(--text);}
.fx-btn.on{background:var(--red);color:#fff;border-color:var(--red);}
.fx-color{width:22px;height:22px;border-radius:4px;border:1px solid var(--border);cursor:pointer;flex-shrink:0;vertical-align:middle;}
.input-row input::placeholder{color:#444}
.gen-btn{padding:11px 22px;background:var(--red);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s,transform .1s}
.gen-btn:hover{background:var(--red2)}
.gen-btn:active{transform:scale(.97)}

/* Canvas */
.canvas-wrap{width:100%;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--border);overflow:hidden;position:relative;margin-bottom:14px;background:repeating-conic-gradient(#2a2a2a 0% 25%,#1a1a1a 0% 50%) 0 0/20px 20px}
canvas{width:100%!important;height:100%!important;display:block}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#333;font-size:12px;pointer-events:none}
.ph svg{width:40px;height:40px;opacity:.2}

/* Bottom */
.bottom-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dl-btn{display:flex;align-items:center;gap:5px;padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;transition:background .15s}
.dl-btn:hover{background:#2a2a2a}
.dl-btn:disabled{opacity:.3;cursor:not-allowed}
.dl-btn svg{width:13px;height:13px}
.status{flex:1;text-align:right;font-size:11px;color:var(--text2)}
</style>
</head>

<div class="card">

  <div class="controls-row">
    <div class="ctrl-box">
      <div class="flabel">text color</div>
      <div class="color-swatches" id="colorSwatches"></div>
      <div class="custom-color">
        <input type="color" id="customColor" value="#ffffff" oninput="setCustomColor(this.value)" />
        <span>custom color</span>
      </div>
    </div>
    <div class="ctrl-box">
      <div class="flabel">alignment</div>
      <div class="size-row" id="alignRow">
        <div class="sz-pill active" data-align="center">Center</div>
        <div class="sz-pill" data-align="left">Left</div>
        <div class="sz-pill" data-align="right">Right</div>
      </div>
      <div class="flabel" style="margin-top:13px">line spacing</div>
      <div class="slider-row">
        <input type="range" id="lineSpacing" min="0.8" max="2.5" step="0.05" value="1.12" oninput="selLineSpacing=parseFloat(this.value);document.getElementById('lsVal').textContent=this.value;regen()" />
        <span class="slider-val" id="lsVal">1.12</span>
      </div>
      <div class="flabel" style="margin-top:13px">letter spacing</div>
      <div class="slider-row">
        <input type="range" id="letterSpacing" min="-10" max="60" step="1" value="0" oninput="selLetterSpacing=parseInt(this.value);document.getElementById('letVal').textContent=this.value+'px';regen()" />
        <span class="slider-val" id="letVal">0px</span>
      </div>
    </div>
  </div>

  <div class="flabel">lines</div>
  <div id="lineEditorWrap"></div>
  <div style="display:flex;gap:8px;margin-top:8px;margin-bottom:16px;">
    <button onclick="addLine()" style="padding:6px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;">+ Add Line</button>
    <button onclick="removeLine()" style="padding:6px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text2);font-size:12px;cursor:pointer;">− Remove</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="c" width="1280" height="720"></canvas>
    <div class="ph" id="ph">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      Type in a line below to start
    </div>
  </div>

  <div class="bottom-row">
    <button class="dl-btn" id="dlBtn" disabled onclick="downloadPNG()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download PNG
    </button>
    <button class="dl-btn" id="cpyBtn" disabled onclick="copyCanvas()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      Copy Image
    </button>
    <span class="status" id="status">1280 × 720 px</span>
  </div>
</div>

function buildColors() {
  const s = document.getElementById('colorSwatches');
  s.innerHTML = '';
  TEXT_COLORS.forEach(({c}) => {
    const d = document.createElement('div');
    d.className = 'swatch' + (selColor === c ? ' active' : '');
    d.style.background = c;
    if (c === '#ffffff' || c === '#f5f5f5') d.style.boxShadow = 'inset 0 0 0 1px #444';
    d.onclick = () => { selColor = c; document.getElementById('customColor').value = c; buildColors(); regen(); };
    s.appendChild(d);
  });
}

function setCustomColor(v) { selColor = v; buildColors(); regen(); }


document.querySelectorAll('[data-align]').forEach(p => {

});


function buildFontOptions(selectedIdx) {
  return FONTS.map((f, i) =>
    `<option value="${i}" ${i === selectedIdx ? 'selected' : ''} style="font-family:${f.f}">${f.name}</option>`
  ).join('');
}

function addLine() {
  if (lineData.length >= 6) return;
  lineData.push({text:'', fontIdx:0, fontSize:DEF_SIZE, color:selColor, bold:false, italic:false, underline:false, highlight:false, hlColor:'#ffff00', outline:false, outColor:'#000000', shadow3d:false, glow:false, stroke:false, strokeColor:'#000000', strokeW:3});
  buildLineEditor(); regen();
}

function removeLine() {
  if (lineData.length <= 1) return;
  lineData.pop();
  buildLineEditor(); regen();
}

function regen() {
  const hasText = lineData.some(l => l.text.trim());
  if (hasText) drawThumbnailMultiFont();
}
function generate() {
  const hasText = lineData.some(l => l.text.trim());
  if (hasText) drawThumbnailMultiFont();
}

function drawThumbnailMultiFont() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = 1280, H = 720;
  canvas.width = W; canvas.height = H;
  ctx.clearRect(0, 0, W, H);

  const activeLines = lineData.filter(l => l.text.trim() !== '' || l.text === '');
  const visibleLines = lineData;

  // Per-line font sizes — use each line's own fontSize
  const isDark = selColor === '#000000' || selColor === '#1a1a1a';
  ctx.shadowColor = isDark ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.85)';
  ctx.shadowBlur = 18; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 3;

  // Calculate total height using each line's own fontSize
  const lineHeights = visibleLines.map(ld => (ld.fontSize || DEF_SIZE) * selLineSpacing);
  const totalH = lineHeights.reduce((a, b) => a + b, 0);
  let cx = W / 2;
  if (selAlign === 'left') cx = 80;
  else if (selAlign === 'right') cx = W - 80;

  // Build Y positions for each line
  const lineYs = [];
  let curY = H / 2 - totalH / 2;
  visibleLines.forEach((ld, i) => {
    const fs = ld.fontSize || selSize;
    lineYs.push(curY + fs * 0.85);
    curY += fs * selLineSpacing;
  });

  visibleLines.forEach((ld, i) => {
    const fs = ld.fontSize || selSize;
    const fontFamily = FONTS[ld.fontIdx] ? FONTS[ld.fontIdx].f : FONTS[0].f;
    const weight = ld.bold ? 'bold' : 'normal';
    const style = ld.italic ? 'italic' : 'normal';
    ctx.font = style + ' ' + weight + ' ' + fs + 'px ' + fontFamily;
    ctx.textAlign = selAlign;
    const lineColor = ld.color || selColor;
    ctx.fillStyle = lineColor;
    const isDarkLine = lineColor === '#000000';
    ctx.shadowColor = isDarkLine ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 16; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
    const y = lineYs[i];
    const line = ld.text;
    if (selLetterSpacing !== 0) {
      const chars = line.split('');
      const totalW = ctx.measureText(line).width + selLetterSpacing * (chars.length - 1);
      let x = selAlign === 'center' ? cx - totalW/2 : selAlign === 'right' ? cx - totalW : cx;
      ctx.textAlign = 'left';
      chars.forEach(ch => { ctx.fillText(ch, x, y); x += ctx.measureText(ch).width + selLetterSpacing; });
      if (ld.underline) {
        const lineW = totalW;
        const ux = selAlign === 'center' ? cx - lineW/2 : selAlign === 'right' ? cx - lineW : cx;
        ctx.shadowBlur = 0;
        ctx.fillRect(ux, y + fs * 0.12, lineW, Math.max(2, fs * 0.06));
      }
      ctx.textAlign = selAlign;
    } else {
      ctx.fillText(line, cx, y);
      if (ld.underline) {
        ctx.shadowBlur = 0;
        const tw = ctx.measureText(line).width;
        const ux = selAlign === 'center' ? cx - tw/2 : selAlign === 'right' ? cx - tw : cx;
        ctx.fillRect(ux, y + fs * 0.12, tw, Math.max(2, fs * 0.06));
      }
    }
  });

  ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
  ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillText('ThumbCraft', W - 22, H - 16);
  document.getElementById('ph').style.display = 'none';
  document.getElementById('dlBtn').disabled = false;
  document.getElementById('cpyBtn').disabled = false;
  document.getElementById('status').textContent = '✓ Ready · 1280×720 · per-line fonts';
}

function downloadPNG() {
  const c = document.getElementById('c');
  const rawTitle = lineData.map(l => l.text).join(' ');
  const slug = rawTitle.trim().replace(/[\s\n]+/g, '-').toLowerCase().slice(0, 30) || 'thumbnail';
  const a = document.createElement('a'); a.download = 'thumbnail-' + slug + '.png'; a.href = c.toDataURL('image/png'); a.click();
}

async function copyCanvas() {
  try {
    document.getElementById('c').toBlob(async blob => {
      await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
      const b = document.getElementById('cpyBtn');
      b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
      setTimeout(() => { b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy Image'; }, 2000);
    });
  } catch(e) { alert('Copy not supported — use Download instead.'); }
}
